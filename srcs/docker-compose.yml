services:
  mariadb:
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    image: inception-mariadb
    restart: always
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    image: inception-wordpress
    restart: always
    depends_on:
      - mariadb
    env_file:
      - .env
    secrets:
      - credentials
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
    container_name: nginx
    image: inception-nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    env_file:
      - .env
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      device: /Users/electrolux/Desktop/data/wordpress
      o: bind
  mariadb:
    driver: local
    driver_opts:
      type: none
      device: /Users/electrolux/Desktop/data/wordpress
      o: bind

networks:
  inception:
    name: inception
    driver: bridge
